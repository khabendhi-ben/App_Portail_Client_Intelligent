services:
  # Service 1 : Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: lematin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: portail_lematin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Service 2 : Backend FastAPI
  backend:
    build: ./backend
    container_name: lematin_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/portail_lematin
    depends_on:
      - db

  # Service 3 : Frontend React
  frontend:
    build: ./frontend
    container_name: lematin_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: